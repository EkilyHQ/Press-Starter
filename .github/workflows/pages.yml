name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages artifact
        run: |
          set -euo pipefail
          rm -rf dist/pages
          mkdir -p dist/pages
          cp index.html index_editor.html site.yaml .nojekyll dist/pages/
          cp -R assets wwwroot dist/pages/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
